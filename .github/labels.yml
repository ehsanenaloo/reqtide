# Labels used by this project.
# The "Sync labels" workflow (Actions tab, Run workflow) creates or updates these labels.
# Labels are only added or updated, never deleted. Colors are hex values without the leading #.

- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: documentation
  color: 0075ca
  description: Improvements to docs, examples or the README
- name: question
  color: d876e3
  description: A usage question, not a bug
- name: good first issue
  color: 7057ff
  description: Small and well described, good for a first contribution
- name: help wanted
  color: 008672
  description: The maintainer would welcome help with this
- name: duplicate
  color: cfd3d7
  description: This already exists in another issue or pull request
- name: invalid
  color: e4e669
  description: This is not a valid report or does not apply
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: security
  color: b60205
  description: Security related. Use private reporting for vulnerabilities
- name: needs triage
  color: ededed
  description: Not reviewed by the maintainer yet
- name: blocked
  color: 5319e7
  description: Waiting on something else before work can continue
- name: ci
  color: bfdadc
  description: Workflows, tooling and repository automation
- name: breaking
  color: b60205
  description: Changes a public name or documented behavior
# Used by Dependabot (see dependabot.yml).
- name: dependencies
  color: 0366d6
  description: Dependency updates
- name: php
  color: 777bb4
  description: PHP dependency updates
- name: github-actions
  color: 000000
  description: GitHub Actions updates
