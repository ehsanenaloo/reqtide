name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Evidence of the platform the tests run on (a GitHub-hosted Linux runner, not a container on another system).
      - name: Record the platform
        run: |
          uname -srm
          php -v | head -n 1
          php -r 'echo PHP_INT_SIZE * 8, " bit, ", PHP_OS_FAMILY, PHP_EOL;'

      - name: Validate manifest
        run: composer validate --strict --no-check-publish

      - name: Validate adapter package manifests
        run: |
          composer validate --strict --no-check-publish packages/redis/composer.json
          composer validate --strict --no-check-publish packages/guzzle/composer.json

      - name: Code style
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Tests
        run: composer test

      - name: Executable examples
        run: bash tools/run-examples.sh --local

      - name: Documentation snippets match executed examples
        run: php tools/check-docs.php

  redis:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Redis ${{ matrix.redis.version }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        redis:
          - version: "7.4.11"
            image: "redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85"
          - version: "8.2.10"
            image: "redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634"
    services:
      redis:
        image: ${{ matrix.redis.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A missing server must fail the job, never skip the suite.
      RT_REQUIRE_REDIS: "1"
      RT_REDIS_HOST: "127.0.0.1"
      RT_REDIS_PORT: "6379"
      RT_REDIS_EXPECT_VERSION: ${{ matrix.redis.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Redis suite
        run: composer test:redis

  lowest:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Lowest dependencies (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: bcmath, curl
          coverage: none
          tools: composer:v2

      # The other jobs install the committed lock; this one proves the lowest versions the manifests allow.
      - name: Install the lowest allowed versions
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: composer test

  redis-specialized:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Redis clock and TLS suites (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The TLS certificate service runs in the PHP 8.3 image, so both images are built first.
      - name: Build the PHP images
        run: docker compose -f tools/docker/compose.yaml build php83 php84

      # The scripts start the pinned servers in Docker and set RT_REQUIRE_REDIS=1, so a missing server fails the step.
      - name: Redis clock suite (controlled server clock)
        run: PHP_SERVICE=php84 bash tools/check-redis-clock.sh

      - name: Redis TLS suite
        if: ${{ !cancelled() }}
        run: PHP_SERVICE=php84 bash tools/check-redis-tls.sh

  fpm:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: PHP-FPM lane (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nginx and PHP-FPM with six workers in Docker, a Redis server, and a driver that sends requests through nginx.
      - name: PHP-FPM lane
        run: bash tools/check-fpm.sh

  wire:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Wire tests (Go server, PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An HTTP server written in Go records what the Guzzle package sends: whole bodies of several sizes, the hazard of a
      # default Content-Length, and an upload that the server cuts short. The server is built in a pinned Go image.
      - name: Wire tests
        run: bash tools/check-wire.sh

  audit:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: bcmath, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit --abandoned=report

      - name: Audit the comparison harness lock
        run: composer audit --abandoned=report --locked --working-dir=benchmarks/comparison

  quality:
    if: github.repository == 'ehsanenaloo/reqtide'
    name: Coverage and mutation (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: bcmath, curl
          coverage: pcov
          ini-values: memory_limit=1G
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coverage
        run: composer coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php8.4
          path: build/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Mutation testing
        run: composer mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-php8.4
          path: build/infection/
          if-no-files-found: warn
          retention-days: 14
