name: Bug report
description: Something returns a wrong result, throws unexpectedly or breaks the build
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please read the [documentation](https://github.com/ehsanenaloo/reqtide/tree/main/docs) and search existing issues first.
        Reqtide is in beta (version 0.x). Do not include secrets, tokens or production data.
        Report security problems privately through the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: Reqtide version or commit
      description: Output of `composer show enaxon/reqtide`, or the commit you use.
      placeholder: "main @ abc1234"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version and platform
      placeholder: "8.4.x, Linux x86-64, Docker image reqtide-php:8.4"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducing script
      description: The smallest self-contained code or test that shows the problem.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected, and the documentation section it comes from, if you know it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The output, or the full exception class and message.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and read the documentation.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets, tokens and production data.
          required: true
