# Usage (from the repository root):
#   docker compose -f tools/docker/compose.yaml run --rm php83 composer check
#   bash tools/check-redis.sh        # starts the "redis" profile below and runs the Redis suites against both servers
#
# Servers are reached by service name from the PHP containers (no ports are published to the host). Images are pinned
# by digest; the digest and the exact version a lane ran are printed by tools/check-redis.sh and belong in its result.
name: reqtide
x-php: &php
  working_dir: /app
  volumes:
    - ../..:/app
    - composer-cache:/tmp/composer-cache
services:
  php83:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.3.35" } }
    image: reqtide-php:8.3
    volumes: [ "../..:/app", "composer-cache:/tmp/composer-cache", "vendor83:/opt/reqtide-vendor", "ftshare:/ft", "tlsshare:/tls" ]
  php84:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.4.26" } }
    image: reqtide-php:8.4
    volumes: [ "../..:/app", "composer-cache:/tmp/composer-cache", "vendor84:/opt/reqtide-vendor", "ftshare:/ft", "tlsshare:/tls" ]
  php85:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.5.11" } }
    image: reqtide-php:8.5
    volumes: [ "../..:/app", "composer-cache:/tmp/composer-cache", "vendor85:/opt/reqtide-vendor", "ftshare:/ft", "tlsshare:/tls" ]
  # --- Redis servers for the Redis package (profile "redis"; the default PHP lanes above never start them) ----------------
  # Persistence is off and the eviction policy is the Redis default (noeviction); both are what the first lanes assume.
  # Later lanes, not defined yet: TLS (a server with a per-run test CA, generated by a script and never committed), a
  # server whose clock the tests control, and a fault-injecting proxy.
  redis74:
    image: "redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85"
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck: &redis-health
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis82:
    image: "redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634"
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck: *redis-health
  # --- Redis servers whose clock the tests control (profile "redis-time") ----------------------------------------
  # Same pinned base images as above, run under libfaketimeMT as root in a test-only image (tools/docker/redis-faketime).
  # The clock is the content of /ft/time on the shared volume "ftshare", which the PHP containers also mount at /ft. Use
  # one server at a time per lane: both share the same file.
  redis74-ft:
    build:
      context: ./redis-faketime
      args: { BASE_IMAGE: "redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85" }
    image: reqtide-redis-ft:7.4.11
    profiles: [redis-time]
    volumes: [ "ftshare:/ft" ]
    healthcheck: *redis-health
  redis82-ft:
    build:
      context: ./redis-faketime
      args: { BASE_IMAGE: "redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634" }
    image: reqtide-redis-ft:8.2.10
    profiles: [redis-time]
    volumes: [ "ftshare:/ft" ]
    healthcheck: *redis-health
  # --- Redis servers with TLS (profile "redis-tls") ------------------------------------------------
  # A one-shot service writes a throwaway CA and server certificate into the volume "tlsshare" (tools/docker/make-test-ca.php,
  # nothing committed); the servers start after it, listen only on the TLS port and do not ask clients for certificates.
  # The PHP containers mount the volume at /tls. Run with tools/check-redis-tls.sh.
  tls-certs:
    image: reqtide-php:8.3
    profiles: [redis-tls]
    working_dir: /app
    volumes: [ "../..:/app:ro", "tlsshare:/tls" ]
    command: ["php", "tools/docker/make-test-ca.php", "/tls"]
  redis74-tls:
    image: "redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85"
    profiles: [redis-tls]
    depends_on: { tls-certs: { condition: service_completed_successfully } }
    volumes: [ "tlsshare:/tls:ro" ]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/tls/server.crt", "--tls-key-file", "/tls/server.key", "--tls-ca-cert-file", "/tls/ca.crt", "--tls-auth-clients", "no"]
    healthcheck: &redis-tls-health
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "-p", "6379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis82-tls:
    image: "redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634"
    profiles: [redis-tls]
    depends_on: { tls-certs: { condition: service_completed_successfully } }
    volumes: [ "tlsshare:/tls:ro" ]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/tls/server.crt", "--tls-key-file", "/tls/server.key", "--tls-ca-cert-file", "/tls/ca.crt", "--tls-auth-clients", "no"]
    healthcheck: *redis-tls-health
  # --- PHP-FPM with nginx for the FPM lane (profile "fpm"; run with tools/check-fpm.sh) ----------------------------------
  # Six static workers behind nginx. The application is tools/fpm-lane/public/index.php; the PHP libraries come from the
  # same vendor volume as the CLI image of the same PHP version. The Redis server is the plain one of the profile "redis".
  fpm:
    build: { context: ./fpm, args: { PHP_VERSION: "8.4.26" } }
    image: reqtide-php-fpm:8.4
    profiles: [fpm]
    volumes: [ "../..:/app:ro", "vendor84:/opt/reqtide-vendor:ro" ]
    environment: { RT_REDIS_HOST: redis82, RT_REDIS_PORT: "6379" }
    depends_on: { redis82: { condition: service_healthy } }
  web:
    image: "nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236"
    profiles: [fpm]
    volumes: [ "../..:/app:ro", "./fpm/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    depends_on: [fpm]
  # --- HTTP fixture server for the Guzzle package (profile "http") ------------------------------------------------------
  # The same server the Guzzle tests start themselves as a child process (packages/guzzle/tests/Fixture/server.php), as a
  # standalone service for lanes that need an external HTTP endpoint (several PHP processes). It records every
  # request: GET /__log lists them, POST /__reset clears them. Plain HTTP only here; the TLS mode (--tls=DIR) is started by the tests themselves.
  http-fixture:
    image: reqtide-php:8.3
    profiles: [http]
    working_dir: /app
    volumes: [ "../..:/app:ro" ]
    command: ["php", "packages/guzzle/tests/Fixture/server.php", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  composer-cache:
  vendor83:
  vendor84:
  vendor85:
  ftshare:
  tlsshare:
