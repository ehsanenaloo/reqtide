upstream origin {
    server wire-origin:8080;
    keepalive 4;
}

server {
    listen 80;
    client_max_body_size 32m;

    # Request bodies are read in full by nginx and sent on with their own length.
    location /buffered/ {
        rewrite ^/buffered/(.*)$ /$1 break;
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Request bodies go through while they arrive.
    location /direct/ {
        rewrite ^/direct/(.*)$ /$1 break;
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    # Responses are passed on as they arrive.
    location /streaming/ {
        rewrite ^/streaming/(.*)$ /$1 break;
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Responses are collected by nginx first (the default of nginx).
    location /collecting/ {
        rewrite ^/collecting/(.*)$ /$1 break;
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
